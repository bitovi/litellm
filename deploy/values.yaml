kind: container
iam:
  oidcSubjects:
    - repo:bitovi/litellm:ref:refs/tags/v*
app:
  name: claude-usage-proxy
  # This repo, not claude-usage-proxy: ESO's per-app PushSecret
  # (bitovi-platform-services charts/platform-app-resources
  # container/github-secrets.yaml) targets whatever repo app.repo names, and
  # THIS repo still owns deploy/values.yaml (infra + official OSS image tag).
  # The Bitovi fork image is deprecated; do not publish via
  # publish-platform-proxy-image.yml. claude-usage-proxy builds no image.
  repo: bitovi/litellm
  port: 4000
  logLevel: info
  healthPath: /health/liveliness
  envSecretName: claude-usage-proxy-secrets
  env:
    PROXY_BASE_URL: https://llm-proxy.bitovi-tools.com
    ALLOWED_EMAIL_DOMAINS: bitovi.com
    LITELLM_USE_SHORT_MCP_TOOL_PREFIX: "true"
    # The Bitnami valkey chart names its Service <releaseName>-primary in
    # standalone mode - there is no bare "claude-usage-proxy-valkey" Service.
    REDIS_HOST: claude-usage-proxy-valkey-primary
    REDIS_PORT: "6379"
# Official BerriAI image. Weekly PRs from bump-oss-litellm-image.yml (Monday).
# Do not tag the Bitovi fork to publish ECR. Pin a digest after a good pull.
image:
  repository: ghcr.io/berriai/litellm
  tag: v1.99.1
ingress:
  host: llm-proxy.bitovi-tools.com
onePasswordItem:
  enabled: true
  itemPath: vaults/bitovi-platform/items/claude-usage-proxy-secrets
  annotations:
    operator.1password.io/auto-restart: "true"
postgres:
  enabled: true
  instances: 2
  database: litellm
  storage:
    size: 20Gi
    storageClass: gp3
  backup:
    enabled: true
bedrock:
  enabled: true
  serviceAccountName: claude-usage-proxy
  serviceAccountNamespace: claude-usage-proxy
database:
  fromCnpg:
    enabled: true
configMap:
  name: litellm-config
  mountPath: /app/config.yaml
  subPath: litellm_config.yaml
container:
  command:
    - litellm
    - --config
    - /app/config.yaml
    - --port
    - "4000"
replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
