[project]
name = "litellm-bitovi"
version = "0.1.0"
description = "Bitovi-owned LiteLLM fork extensions (compose instead of patching upstream core)"
readme = "litellm_bitovi/README.md"
requires-python = ">=3.9"
authors = [
    { name = "Bitovi" },
]

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""
